name: Daily Municipal & Portal Event Crawler

on:
  schedule:
    # 매일 한국시간(KST) 새벽 04:00 (UTC 19:00) 자동 실행
    - cron: '0 19 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 언제든 수동 즉시 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full crawl pipeline (municipal → swimming → sports → normalize)
        run: npm run crawl
        env:
          KORSERVICE2_KEY: ${{ secrets.KORSERVICE2_KEY }}

      - name: Commit and push updated event snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "변경된 행사 스냅샷이 없습니다."
          else
            git commit -m "chore(data): daily auto-crawl municipal & portal events [$(date -u +'%Y-%m-%d')]"
            git push
          fi
